name: Azure OIDC login test

on:
  workflow_dispatch:

permissions: {}

jobs:
  login:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_LOGIN_PRE_CLEANUP: true
      AZURE_LOGIN_POST_CLEANUP: true
    steps:
      - name: Set temporary Azure configuration directory
        shell: bash
        run: |
          set -euo pipefail
          echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-login-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check runner account and Azure CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = github-runner
          command -v az >/dev/null
          echo "Dedicated runner account and Azure CLI confirmed."

      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3 (Node.js 24)
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify service principal and lab resource group access
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query user.type --output tsv)" = servicePrincipal
          az group show --name rg-azure-infra-security-lab --output none
          echo "OIDC login succeeded; the pipeline identity can read the lab resource group."

      - name: Remove temporary Azure session
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v az >/dev/null; then
            az account clear || true
          fi
          if [[ -n "${AZURE_CONFIG_DIR:-}" ]]; then
            rm -rf -- "$AZURE_CONFIG_DIR"
          fi
