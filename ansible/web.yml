---
- name: Configure the lab web server
  hosts: web
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Start Nginx and enable it at boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy the lab homepage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Azure Infrastructure & Security Lab</title></head>
          <body>
            <h1>Azure Infrastructure & Security Lab</h1>
            <p>Provisioned with Terraform. Configured with Ansible.</p>
          </body>
          </html>

    - name: Verify local HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code: 200
