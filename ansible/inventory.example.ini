# Copy to inventory.local.ini and replace the username and connection details.
# The example uses private addresses; SSH uses the jump alias in ssh_config.example.
[management]
azure-lab-mgmt ansible_host=203.0.113.10

[web]
azure-lab-web ansible_host=10.50.2.4

[app]
azure-lab-app ansible_host=10.50.3.4

[database]
azure-lab-db ansible_host=10.50.4.4

[test]
azure-lab-test ansible_host=10.60.1.4

[all:vars]
ansible_user=labadmin
ansible_ssh_private_key_file=~/.ssh/azure_lab
ansible_python_interpreter=/usr/bin/python3

[private_workloads:children]
web
app
database
test

[private_workloads:vars]
ansible_ssh_common_args='-o ProxyJump=azure-lab-mgmt'
